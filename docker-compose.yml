services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: revisor
      POSTGRES_PASSWORD: revisor
      POSTGRES_DB: revisor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revisor -d revisor"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://revisor:revisor@db:5432/revisor
      DATA_DIR: /data
      CACHE_DIR: /app/cache
      GOOGLE_CREDENTIALS: /secrets/credentials.json
      GOOGLE_TOKEN: /secrets/token.json
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Confidential dataset, read-only. Set DATA_DIR in .env (host path).
      - ${DATA_DIR:-./data}:/data:ro
      # Files of uploaded and Google Drive projects: the only writable part of the dataset.
      - ${DATA_DIR:-./data}/_proyectos:/data/_proyectos
      # Google credentials and token (never committed).
      - ./.secrets:/secrets
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
