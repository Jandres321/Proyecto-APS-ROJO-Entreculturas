[project]
name = "revisor-justificacion-api"
version = "0.1.0"
description = "Backend del Revisor de justificación (Entreculturas · IA4GOOD)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pymupdf>=1.24",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]
# Optional LLM provider (LLM_PROVIDER=anthropic).
llm = [
    "anthropic>=0.40",
]
# Review app (ui/streamlit_app.py).
ui = [
    "streamlit>=1.40",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The local alembic/ folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]
