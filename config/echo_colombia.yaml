# Segundo caso: 23-CO-034 ECHO (Colombia). Donante distinto, otra convención de nombres.
# La carpeta es solo una MUESTRA (12 PDF frente a ~3.000 gastos): la mayoría de gastos
# deben quedar "sin justificante" y se mide también que no se inventen emparejamientos.
proyecto: "23-CO-034 ECHO Colombia"

documentos:
  tipo: local
  ruta: "TUM_SociAI/DocJustificativa/23-CO-034 - ECHO"
  excluir:
    - "Listado facturas*"
    - "MR_Budget*"
    - "*.zip"                 # guías de ECHO, no son justificantes

listado:
  archivo: "TUM_SociAI/DocJustificativa/23-CO-034 - ECHO/Listado facturas.xlsx"
  hoja: "List of expenses"
  columnas:
    orden: 0          # Nº ORDEN manual -> SOLO para validar
    factura: 1        # Nº factura ("Fv584336", "Nómina", "Doc. Equiv. PA975"...)
    fecha: 3
    descripcion: 4
    proveedor: 5
    importe_eur: 11   # Total euros equivalentes
    partida: 17       # línea presupuestaria ECHO (II.3.2.3...)
  columnas_referencia: [2]   # Código contable del comprobante de egreso (206-15000, 800-00337...)
  imputacion:
    donante: [13]     # Imputado a ECHO
    otros: [14]       # Imputado a PRM
  obligatorias: [fecha, factura]

referencias:
  # Código contable: 3 dígitos - número (o letras+número): 206-15000, 110-19127, 112-PA975
  patron: '(?<![0-9])(?P<prefijo>\d{3})-(?P<numero>[A-Z]{0,3}\d{3,})'
  numeros_largos: false

# Nº de orden manual dentro del nombre: "Equipos_50_51_52_53-206-15000" -> 50, 51, 52, 53
prefijo_orden: '_(?P<lista>\d{1,4}(?:_\d{1,4})*)(?=[-_]\d{3}-)'

# Mismos pesos y umbrales que Uganda (sin ajustar a este proyecto)
cruce:
  umbral: 0.60
  umbral_alta: 0.80
  margen_ambiguo: 0.05
  bonus_mes: 0.08
  bonus_mes_anterior: 0.04
  penalizacion_mes: 0.25
  bonus_referencia: 0.35
  minimo_referencia: 0.62
  bonus_numero: 0.20
  penalizacion_referencia: 0.15
  conceptos_mes_vencido: [nssf, pension, seguro medico]

sinonimos:
  salario: [nomina, payroll, salary, wage]
  seguro: [insurance]
  combustible: [fuel]
  vehiculo: [motocicleta, moto, vehicle]
  refrigerio: [aperitivo, snack]
  comision: [fee, charge]
