# Proyecto piloto: 24-UG-226 Adjumani - Xunta de Galicia 2024
# Las rutas son relativas a la raíz del repositorio.
proyecto: "24-UG-226 Adjumani - Xunta 2024"

documentos:
  tipo: local                 # más adelante: drive
  ruta: "TUM_SociAI/DocJustificativa/24-UG-226 Adjumani - Xunta 2024"
  # Documentos de la carpeta que no son justificantes de gasto
  excluir:
    - "Informe_economico_final*"
    - "Anuncio*"
    - "2024_formulario*"
    - "2024_guia*"

listado:
  archivo: "TUM_SociAI/DocJustificativa/24-UG-226 Adjumani - Xunta 2024/Informe_economico_final_Adjuamni_def 14.10.25 v1.xls"
  hoja: "Relación de facturas"
  # Columnas por posición (0 = A). Las cabeceras de la Xunta son bilingües y largas.
  columnas:
    partida: 0
    orden: 1          # nº de orden puesto a mano -> SOLO para validar, el cruce no lo usa
    fecha: 2
    factura: 3
    proveedor: 4
    descripcion: 5
    importe_eur: 7
    pago: 10
  # Una fila es un gasto si tiene fecha y nº de factura
  obligatorias: [fecha, factura]

referencias:
  # Nº de factura/comprobante de JRS Uganda: EB UGA04 602, FP UGA04 108, CV UGA04-113, EBUGA04-060...
  patron: '(?<![A-Z])(?P<prefijo>[A-Z]{2}(?:\s*CAM)?)[\s\-_]*UGA\d{2}[\s\-_]*(?P<numero>\d+)'
  # Además, cualquier número de 5+ cifras se trata como referencia (p. ej. nº de factura 46681)
  numeros_largos: true

# Nº de orden manual al inicio del nombre del archivo: "1. ", "10.A ", "49A ", "33-39 "
# El cruce lo OCULTA; la validación lo usa como respuesta correcta.
prefijo_orden: '^(?P<desde>\d+)(?:-(?P<hasta>\d+))?(?:\.?\s?(?P<sufijo>[A-Za-z])(?=[\s._]))?(?=[\s.])\.?'

cruce:
  umbral: 0.60          # por debajo -> gasto sin justificante
  umbral_alta: 0.80     # por encima (y sin ambigüedad) -> confianza alta
  margen_ambiguo: 0.05  # si el 2º candidato está a menos -> ambiguo, revisar
  bonus_mes: 0.08       # el documento menciona el mes del gasto
  bonus_mes_anterior: 0.04   # ...o el mes anterior (cotizaciones que se pagan al mes siguiente)
  penalizacion_mes: 0.25     # el documento menciona otro mes
  bonus_referencia: 0.35     # el nº de factura del listado aparece en el nombre del archivo
  minimo_referencia: 0.62    # con referencia coincidente se asigna aunque el concepto difiera
  bonus_numero: 0.20         # coincide el número pero no el prefijo (EB/CV/FP)
  penalizacion_referencia: 0.15  # ambos tienen nº de factura y no coinciden
  # Cotizaciones que se pagan el mes siguiente: el documento lleva el mes anterior a la fecha de pago
  conceptos_mes_vencido: [nssf, pension, seguro medico]

# Sinónimos del dominio (se comparan tras quitar acentos y plurales)
sinonimos:
  salario: [nomina, payroll, salary, wage]
  seguro: [insurance]
  combustible: [fuel]
  vehiculo: [motocicleta, moto, vehicle]
  refrigerio: [aperitivo, snack]
  comision: [fee, charge]
