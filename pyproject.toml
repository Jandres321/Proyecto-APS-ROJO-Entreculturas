[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "conciliador"
version = "0.1.0"
description = "Asocia cada gasto del listado de justificación con su documento justificante"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "xlrd>=2.0", "rapidfuzz>=3.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
drive = ["google-api-python-client>=2.100", "google-auth>=2.20", "google-auth-oauthlib>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
